<style>
/* Layout: sticky left rail listing the six phases like a test-run report (TODO / RUN / PASS),
   one reading column beside it. Views switch by URL hash. Code blocks stay dark in both themes. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --fg:#13211C; --muted:#52645D; --line:#D3DDD8;
  --accent:#0B6B5F; --accent-fg:#FFFFFF; --accent-soft:#D6EEE8;
  --warn:#8A5200; --warn-soft:#FBEBCF; --bad:#B3261E; --bad-soft:#FBE0DD; --good:#1B6B3A; --good-soft:#D9F0E0;
  --code-bg:#0F1B17; --code-fg:#D7E8E1; --code-line:#2A3E35; --code-muted:#8CA69C;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1411; --surface:#131E19; --surface-2:#1A2923; --fg:#E3EEE9; --muted:#97ABA3; --line:#26372F;
    --accent:#4FD1BC; --accent-fg:#06211C; --accent-soft:#123A33;
    --warn:#F2B45A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3B1816; --good:#6FD79A; --good-soft:#12301E;
    --code-bg:#08110E; --code-fg:#D7E8E1; --code-line:#22342C; --code-muted:#7F998F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#131E19; --surface-2:#1A2923; --fg:#E3EEE9; --muted:#97ABA3; --line:#26372F;
  --accent:#4FD1BC; --accent-fg:#06211C; --accent-soft:#123A33;
  --warn:#F2B45A; --warn-soft:#3A2A10; --bad:#FF8A80; --bad-soft:#3B1816; --good:#6FD79A; --good-soft:#12301E;
  --code-bg:#08110E; --code-fg:#D7E8E1; --code-line:#22342C; --code-muted:#7F998F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.6;
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
button{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
.mono{font-family:var(--font-mono)}
.label{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.shell{max-width:1180px; margin-inline:auto; display:grid; grid-template-columns:260px minmax(0,1fr); gap:40px; align-items:start}

/* rail */
.rail{position:sticky; top:env(safe-area-inset-top,0px); display:flex; flex-direction:column; gap:20px; max-height:100vh; overflow:auto; padding-bottom:16px}
.brand{display:flex; flex-direction:column; gap:4px}
.brand b{font-family:var(--font-display); font-size:22px; line-height:1.1}
.overall{display:flex; flex-direction:column; gap:8px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.overall .row{display:flex; justify-content:space-between; align-items:baseline}
.overall .pct{font-family:var(--font-mono); font-size:24px; font-weight:600}
.bar{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:9px 10px; border-radius:8px; text-decoration:none; color:var(--fg); font-size:15px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft); font-weight:600}
.nav .sep{height:1px; background:var(--line); margin:8px 0}
.nav small{display:block; color:var(--muted); font-size:12px; font-weight:400}
.chip{font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.06em; padding:2px 7px; border-radius:5px; white-space:nowrap}
.chip.todo{background:var(--surface-2); color:var(--muted)}
.chip.run{background:var(--warn-soft); color:var(--warn)}
.chip.pass{background:var(--good-soft); color:var(--good)}

/* main */
.main{min-width:0; display:flex; flex-direction:column; gap:36px; padding-bottom:48px}
.eyebrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
h1{font-size:clamp(30px,5vw,46px); letter-spacing:-.01em}
h2{font-size:clamp(22px,3vw,28px)}
h3{font-size:18px}
.lead{font-size:18px; color:var(--muted); max-width:62ch}
.hero{display:flex; flex-direction:column; gap:14px}
.callout{display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px}
.callout p{max-width:68ch}
.callout ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; max-width:68ch}
.section{display:flex; flex-direction:column; gap:16px}
.section>header{display:flex; flex-direction:column; gap:4px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.card{display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; text-decoration:none; color:var(--fg); min-width:0}
a.card:hover{border-color:var(--accent)}
.card .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.card p{color:var(--muted); font-size:15px}
.legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px}
.legend div{display:flex; flex-direction:column; gap:2px; padding-left:12px; border-left:2px solid var(--line)}
.legend b{font-weight:600}
.legend span{color:var(--muted); font-size:15px}

/* checklists */
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.item{display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer}
.item:hover{border-color:var(--accent)}
.item input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--accent); cursor:pointer}
.item b{display:block; font-weight:600}
.item span{color:var(--muted); font-size:15px}
.item.done b{text-decoration:line-through; text-decoration-color:var(--muted)}
.item.done{background:var(--surface-2)}

/* tutorial */
.steps{display:flex; flex-direction:column; gap:22px}
.step{display:grid; grid-template-columns:34px minmax(0,1fr); gap:14px}
.step .n{font-family:var(--font-mono); font-weight:600; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:var(--accent); color:var(--accent-fg)}
.step .body{display:flex; flex-direction:column; gap:10px; min-width:0}
.step .body p{max-width:68ch}
.code{position:relative; background:var(--code-bg); border:1px solid var(--code-line); border-radius:10px}
.code .bar-top{display:flex; justify-content:space-between; align-items:center; padding:6px 8px 6px 14px; border-bottom:1px solid var(--code-line)}
.code .lang{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--code-muted)}
.code pre{margin:0; padding:14px; overflow-x:auto; font-family:var(--font-mono); font-size:13.5px; line-height:1.6; color:var(--code-fg); tab-size:2}
.code pre code{font-family:inherit}
.copy{background:transparent; border:1px solid var(--code-line); color:var(--code-fg); border-radius:6px; padding:3px 10px; font-family:var(--font-mono); font-size:12px; cursor:pointer}
.copy:hover{border-color:var(--accent); color:var(--accent)}

/* takeaways */
.take{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
.take div{background:var(--accent-soft); border-radius:10px; padding:14px 16px; font-size:15.5px}

/* quiz */
.quiz{display:flex; flex-direction:column; gap:18px}
.q{display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px}
.q>b{font-weight:600}
.opt{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:start; padding:9px 12px; border:1px solid var(--line); border-radius:8px; cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin:3px 0 0; accent-color:var(--accent)}
.opt.right{background:var(--good-soft); border-color:var(--good)}
.opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
.why{font-size:15px; color:var(--muted)}
.result{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.btn{background:var(--accent); color:var(--accent-fg); border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.score{font-family:var(--font-mono); font-weight:600}

/* badges */
.badge-block{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px}
.badge-block svg,.bcard svg{width:76px; height:auto; display:block}
.reqs{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.req{font-family:var(--font-mono); font-size:12px; padding:3px 8px; border-radius:5px; background:var(--surface-2); color:var(--muted)}
.req.ok{background:var(--good-soft); color:var(--good)}
.bgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.bcard{display:flex; flex-direction:column; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0}
.bcard .head{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:center}
.bcard.locked{border-style:dashed}
.field{display:flex; flex-direction:column; gap:4px}
.field input[type=url],.field input[type=text]{width:100%; font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg)}

/* weekly plan */
.wk-group{display:flex; flex-direction:column; gap:8px}
.wk-group>h3{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.wk{display:grid; grid-template-columns:auto 64px minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer}
.wk:hover{border-color:var(--accent)}
.wk input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--accent)}
.wk .w{font-family:var(--font-mono); font-weight:600}
.wk small{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.wk.done{background:var(--surface-2)}

.pager{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:20px}
.pager a{text-decoration:none; font-weight:600}
.logbox{max-width:100%}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr); gap:22px}
  .rail{position:static; max-height:none; overflow:visible}
  .nav{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px}
  .nav a{display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:max-content; border:1px solid var(--line); background:var(--surface)}
  .nav small{display:none}
  .nav .sep{display:none}
}
@media (max-width:640px){
  .wk{grid-template-columns:auto minmax(0,1fr); }
  .wk .w{grid-column:2}
  .wk>div{grid-column:2}
  .badge-block{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ .bar>i{transition:none} }
</style>

<script type="text/plain" id="c-p1-script">
type LoginCase = {
  name: string;
  user: string;
  pass: string;
  expected: 'success' | 'error';
};

const cases: LoginCase[] = [
  { name: 'valid credentials', user: 'standard_user', pass: 'secret_sauce', expected: 'success' },
  { name: 'wrong password',    user: 'standard_user', pass: 'nope',         expected: 'error' },
  { name: 'empty username',    user: '',              pass: 'secret_sauce', expected: 'error' },
];

function fakeLogin(user: string, pass: string): 'success' | 'error' {
  return user === 'standard_user' && pass === 'secret_sauce' ? 'success' : 'error';
}

for (const c of cases) {
  const actual = fakeLogin(c.user, c.pass);
  console.log(`${actual === c.expected ? 'PASS' : 'FAIL'}  ${c.name}`);
}
</script>

<script type="text/plain" id="c-p3-test">
import { test, expect } from '@playwright/test';

test.describe('SauceDemo login', () => {
  test('valid user lands on the inventory page', async ({ page }) => {
    await page.goto('https://www.saucedemo.com');
    await page.getByPlaceholder('Username').fill('standard_user');
    await page.getByPlaceholder('Password').fill('secret_sauce');
    await page.getByRole('button', { name: 'Login' }).click();

    await expect(page).toHaveURL(/inventory/);
    await expect(page.getByText('Products')).toBeVisible();
  });

  test('locked out user sees an error', async ({ page }) => {
    await page.goto('https://www.saucedemo.com');
    await page.getByPlaceholder('Username').fill('locked_out_user');
    await page.getByPlaceholder('Password').fill('secret_sauce');
    await page.getByRole('button', { name: 'Login' }).click();

    await expect(page.locator('[data-test="error"]')).toContainText('locked out');
  });
});
</script>

<script type="text/plain" id="c-p4-api">
import { test, expect } from '@playwright/test';

const base = 'https://jsonplaceholder.typicode.com';

test('GET a post', async ({ request }) => {
  const res = await request.get(`${base}/posts/1`);
  expect(res.status()).toBe(200);

  const body = await res.json();
  expect(body).toMatchObject({ id: 1, userId: 1 });
  expect(typeof body.title).toBe('string');
});

test('POST creates a post', async ({ request }) => {
  const res = await request.post(`${base}/posts`, {
    data: { title: 'qa', body: 'hello', userId: 1 },
  });
  expect(res.status()).toBe(201);
  expect(await res.json()).toMatchObject({ title: 'qa' });
});
</script>

<script type="text/plain" id="c-p5-pom">
// pages/LoginPage.ts
import { Page, Locator, expect } from '@playwright/test';

export class LoginPage {
  readonly username: Locator;
  readonly password: Locator;
  readonly loginButton: Locator;
  readonly error: Locator;

  constructor(private readonly page: Page) {
    this.username = page.getByPlaceholder('Username');
    this.password = page.getByPlaceholder('Password');
    this.loginButton = page.getByRole('button', { name: 'Login' });
    this.error = page.locator('[data-test="error"]');
  }

  async open() {
    await this.page.goto('/');
  }

  async login(user: string, pass: string) {
    await this.username.fill(user);
    await this.password.fill(pass);
    await this.loginButton.click();
  }

  async expectError(text: string) {
    await expect(this.error).toContainText(text);
  }
}
</script>

# .github/workflows/playwright.yml
name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:

 ['Test strategy and regression candidates','One-page strategy'],
 ['Automate real cases','3 real regression cases'],
 ['Portfolio polish','README, badge and demo'],
 ['CV, LinkedIn and interview practice','First applications sent']
];

/* ---------- state ---------- */
const KEY = 'qa-roadmap-v1';
const PASS_AT = 3;
let S = {topics:{}, ex:{}, weeks:{}, quiz:{}, links:{}, earned:{}};
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === 'object') S = Object.assign(S, p); }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const codeOf = id => { const el = document.getElementById(id); return el ? el.textContent.replace(/^\n/,'').replace(/\n$/,'') : ''; };
const key = (p, i) => p + '-' + i;
const setFlag = (obj, k, on) => { if (on) obj[k] = true; else delete obj[k]; };
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* ---------- progress ---------- */
function counts(p) {
  const t = p.topics.filter((_, i) => S.topics[key(p.id, i)]).length;
  const e = p.exercises.filter((_, i) => S.ex[key(p.id, i)]).length;
  const qz = S.quiz[p.id];
  const passed = !!(qz && qz.done && qz.score >= PASS_AT);
  return {t, e, tt: p.topics.length, et: p.exercises.length, passed, done: t + e, total: p.topics.length + p.exercises.length};
}
const qualifies = p => { const c = counts(p); return c.t === c.tt && c.e === c.et && c.passed; };
const isEarned = p => !!S.earned[p.id];
function syncEarned() { PHASES.forEach(p => { if (!S.earned[p.id] && qualifies(p)) S.earned[p.id] = today(); }); }
function status(p) {
  if (isEarned(p)) return 'pass';
  const c = counts(p), q = S.quiz[p.id];
  return (c.done > 0 || (q && q.done)) ? 'run' : 'todo';
}
function overall() {
  let d = 0, t = 0;
  PHASES.forEach(p => { const c = counts(p); d += c.done; t += c.total; });
  return {d, t, pct: t ? Math.round(d / t * 100) : 0};
}
const weeksDone = () => Object.keys(S.weeks).filter(k => S.weeks[k]).length;
const earnedCount = () => PHASES.filter(isEarned).length;
const CHIP = {todo:'TODO', run:'RUN', pass:'PASS'};

/* ---------- shared pieces ---------- */
function bar(pct, label) {
  return `<div class="bar" role="progressbar" aria-label="${esc(label)}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
}
function badgeSvg(n, earned) {
  const pts = '40,3 75,22 75,70 40,89 5,70 5,22';
  if (earned) {
    return `<svg viewBox="0 0 80 92" role="img" aria-label="Phase ${n} badge, earned"><polygon points="${pts}" style="fill:var(--accent)"/><polygon points="40,12 67,27 67,65 40,80 13,65 13,27" style="fill:none;stroke:var(--accent-fg);stroke-opacity:.5;stroke-width:1.5"/><text x="40" y="53" text-anchor="middle" style="fill:var(--accent-fg);font-family:var(--font-mono);font-weight:600;font-size:20px">P${n}</text></svg>`;
  }
  return `<svg viewBox="0 0 80 92" role="img" aria-label="Phase ${n} badge, locked"><polygon points="${pts}" style="fill:none;stroke:var(--muted);stroke-opacity:.6;stroke-width:2;stroke-dasharray:5 4"/><text x="40" y="53" text-anchor="middle" style="fill:var(--muted);font-family:var(--font-mono);font-weight:600;font-size:20px">P${n}</text></svg>`;
}
function reqs(p) {
  const c = counts(p);
  const r = (ok, txt) => `<span class="req${ok ? ' ok' : ''}">${ok ? 'DONE' : 'TODO'} ${txt}</span>`;
  return `<div class="reqs">${r(c.t === c.tt, 'topics ' + c.t + '/' + c.tt)}${r(c.e === c.et, 'exercises ' + c.e + '/' + c.et)}${r(c.passed, 'quiz ' + PASS_AT + '/' + p.quiz.length)}</div>`;
}
function codeBlock(id, lang) {
  return `<div class="code"><div class="bar-top"><span class="lang">${esc(lang || 'text')}</span><button class="copy" type="button" data-copy="${id}">Copy</button></div><pre><code>${esc(codeOf(id))}</code></pre></div>`;
}
function item(kind, pid, i, title, desc) {
  const k = key(pid, i);
  const on = kind === 'topic' ? S.topics[k] : S.ex[k];
  return `<li><label class="item${on ? ' done' : ''}"><input type="checkbox" data-kind="${kind}" data-p="${pid}" data-i="${i}"${on ? ' checked' : ''}><div><b>${esc(title)}</b>${desc ? `<span>${esc(desc)}</span>` : ''}</div></label></li>`;
}

/* ---------- chrome ---------- */
function renderChrome(r) {
  const o = overall();
  $('#overall').innerHTML = `<div class="row"><span class="label">Progress</span><span class="pct">${o.pct}%</span></div>${bar(o.pct, 'Overall progress')}<span class="label">${o.d} of ${o.t} items &middot; ${earnedCount()} of 6 badges</span>`;
  const link = (id, label, sub, chip) =>
    `<a href="#${id}"${r === id ? ' aria-current="page"' : ''}><span>${label}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${chip ? `<span class="chip ${chip}">${CHIP[chip]}</span>` : ''}</a>`;
  $('#nav').innerHTML =
    link('overview', 'Overview', '', '') +
    PHASES.map(p => link('phase-' + p.id, 'Phase ' + p.id, p.short, status(p))).join('') +
    '<div class="sep"></div>' +
    link('plan', 'Weekly plan', weeksDone() + ' of 24 weeks done', '') +
    link('badges', 'Badges', earnedCount() + ' of 6 earned', '');
}

/* ---------- views ---------- */
function viewOverview() {
  const cards = PHASES.map(p => {
    const c = counts(p), pct = c.total ? Math.round(c.done / c.total * 100) : 0, st = status(p);
    return `<a class="card" href="#phase-${p.id}"><div class="top"><span class="label">Phase ${p.id} &middot; ${esc(p.weeks)}</span><span class="chip ${st}">${CHIP[st]}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.goal)}</p>${bar(pct, p.title + ' progress')}<span class="label">${c.done} of ${c.total} items &middot; Badge: ${esc(p.badge.name)}</span></a>`;
  }).join('');
  return `
  <section class="hero">
    <div class="eyebrow"><span class="label">24 weeks</span><span class="label">1 to 2 hours a day</span></div>
    <h1>From manual tester to Playwright automation engineer</h1>
    <p class="lead">Six phases. Each one has topics to learn, a hands-on tutorial, exercises, key takeaways, a quiz and a badge you can show on GitHub or LinkedIn. Your progress is saved in this browser.</p>
    <a class="btn" href="#phase-1" style="display:inline-block;width:fit-content;text-decoration:none">Start Phase 1</a>
  </section>
  <section class="callout">
    <span class="label">Which language for Playwright?</span>
    <h2>TypeScript, learned in two steps</h2>
    <p>Playwright is built on Node.js. Its test runner, UI mode, trace viewer and code generator work best with TypeScript and JavaScript, and new features arrive there first. TypeScript also lets your editor autocomplete every Playwright method, which helps a lot while you learn.</p>
    <ul>
      <li>Weeks 1 to 3: plain JavaScript syntax (variables, functions, arrays, async and await).</li>
      <li>Week 4: add TypeScript types on top of what you already know.</li>
      <li>If your company uses Python, Playwright supports it too. Follow the same roadmap and use pytest-playwright.</li>
    </ul>
  </section>
  <section class="section"><header><h2>The six phases</h2></header><div class="cards">${cards}</div></section>
  <section class="section"><header><h2>Inside every phase</h2></header>
    <div class="legend">
      <div><b>Topics</b><span>A checklist of what to understand.</span></div>
      <div><b>Mini-tutorial</b><span>Numbered steps with code you can copy.</span></div>
      <div><b>Exercises</b><span>Practice tasks that become portfolio items.</span></div>
      <div><b>Key takeaways</b><span>The ideas to keep after the phase.</span></div>
      <div><b>Quiz</b><span>Four questions. Pass with 3 of 4.</span></div>
      <div><b>Badge</b><span>Earned when topics, exercises and quiz are done.</span></div>
    </div>
  </section>`;
}

function progressBlock(p) {
  const c = counts(p), pct = c.total ? Math.round(c.done / c.total * 100) : 0, q = S.quiz[p.id];
  const qs = q && q.done ? 'quiz ' + q.score + '/' + p.quiz.length : 'quiz not taken';
  return `${bar(pct, 'Phase ' + p.id + ' progress')}<span class="label">${c.t} of ${c.tt} topics &middot; ${c.e} of ${c.et} exercises &middot; ${qs}</span>`;
}
function badgeBlock(p) {
  const earned = isEarned(p);
  return `<div class="badge-block">${badgeSvg(p.id, earned)}<div><h3>${esc(p.badge.name)}</h3><p>${esc(p.badge.desc)}</p>${reqs(p)}${earned ? `<p class="why" style="margin-top:8px">Earned on ${S.earned[p.id]}. Copy it for your README from the <a href="#badges">Badges page</a>.</p>` : ''}</div></div>`;
}
function quizList(p) {
  const st = S.quiz[p.id] || {sel: [], done: false, score: 0}, sel = st.sel || [];
  return p.quiz.map((q, qi) => `<div class="q"><b>${qi + 1}. ${esc(q.q)}</b>${q.o.map((o, oi) => {
    let cls = 'opt';
    if (st.done) { if (oi === q.a) cls += ' right'; else if (sel[qi] === oi) cls += ' wrong'; }
    return `<label class="${cls}"><input type="radio" name="q-${p.id}-${qi}" data-quiz="${p.id}" data-q="${qi}" data-o="${oi}"${sel[qi] === oi ? ' checked' : ''}${st.done ? ' disabled' : ''}><span>${esc(o)}</span></label>`;
  }).join('')}${st.done ? `<p class="why">${esc(q.why)}</p>` : ''}</div>`).join('');
}
function quizFoot(p) {
  const st = S.quiz[p.id] || {sel: [], done: false, score: 0}, sel = st.sel || [], n = p.quiz.length;
  if (st.done) {
    const pass = st.score >= PASS_AT;
    return `<div class="result"><span class="score">${st.score} / ${n}</span><span>${pass ? 'Passed. Nice work.' : 'The pass mark is ' + PASS_AT + ' of ' + n + '. Review the takeaways and try again.'}</span><button class="btn ghost" type="button" data-act="retake" data-p="${p.id}">Retake quiz</button></div>`;
  }
  const answered = p.quiz.filter((_, i) => Number.isInteger(sel[i])).length;
  return `<div class="result"><button class="btn" type="button" data-act="grade" data-p="${p.id}"${answered === n ? '' : ' disabled'}>Check answers</button><span class="label">${answered} of ${n} answered</span></div>`;
}
const quizBlock = p => `<div class="quiz"><div id="qlist" class="quiz">${quizList(p)}</div><div id="qfoot">${quizFoot(p)}</div></div>`;

function viewPhase(p) {
  const prev = PHASES[p.id - 2], next = PHASES[p.id];
  const steps = p.steps.map((s, k) => `<div class="step"><div class="n">${k + 1}</div><div class="body"><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p>${s.code ? codeBlock(s.code, s.lang) : ''}</div></div>`).join('');
  return `
  <header class="hero">
    <div class="eyebrow"><span class="label">Phase ${p.id} of 6</span><span class="label">${esc(p.weeks)}</span></div>
    <h1>${esc(p.title)}</h1>
    <p class="lead">${esc(p.goal)}</p>
    <div id="pprog" style="display:flex;flex-direction:column;gap:8px">${progressBlock(p)}</div>
  </header>
  <section class="section"><header><h2>Topics</h2><p class="why">Tick a topic when you can explain it in your own words.</p></header>
    <ul class="list">${p.topics.map((t, i) => item('topic', p.id, i, t.t, t.d)).join('')}</ul></section>
  <section class="section"><header><h2>Mini-tutorial</h2><p class="why">Follow along on your computer. Type the code yourself when you can, and paste only when you are stuck.</p></header>
    <div class="steps">${steps}</div></section>
  <section class="section"><header><h2>Exercises</h2><p class="why">Do these after the tutorial. Keep the results in a GitHub repository.</p></header>
    <ul class="list">${p.exercises.map((t, i) => item('ex', p.id, i, t, '')).join('')}</ul></section>
  <section class="section"><header><h2>Key takeaways</h2></header>
    <div class="take">${p.takeaways.map(t => `<div>${esc(t)}</div>`).join('')}</div></section>
  <section class="section"><header><h2>Quiz</h2><p class="why">Four questions. You need ${PASS_AT} correct to pass, and you can retake it.</p></header>
    <div id="quiz">${quizBlock(p)}</div></section>
  <section class="section"><header><h2>Your badge</h2></header><div id="pbadge">${badgeBlock(p)}</div></section>
  <nav class="pager" aria-label="Phase navigation">
    ${prev ? `<a href="#phase-${prev.id}">&larr; Phase ${prev.id}: ${esc(prev.short)}</a>` : '<a href="#overview">&larr; Overview</a>'}
    ${next ? `<a href="#phase-${next.id}">Phase ${next.id}: ${esc(next.short)} &rarr;</a>` : '<a href="#badges">Your badges &rarr;</a>'}
  </nav>`;
}

function weekProgress() {
  const d = weeksDone(), pct = Math.round(d / 24 * 100);
  return `${bar(pct, 'Weeks completed')}<span class="label">${d} of 24 weeks done</span>`;
}
function viewPlan() {
  const groups = PHASES.map(p => {
    let rows = '';
    for (let w = p.w[0]; w <= p.w[1]; w++) {
      const d = !!S.weeks[w], r = WEEKS[w - 1];
      rows += `<label class="wk${d ? ' done' : ''}"><input type="checkbox" data-kind="week" data-i="${w}"${d ? ' checked' : ''}><span class="w">W${w}</span><div><small>Focus</small>${esc(r[0])}</div><div><small>Deliverable</small>${esc(r[1])}</div></label>`;
    }
    return `<div class="wk-group"><h3><span>Phase ${p.id}: ${esc(p.title)}</span><span class="label">${esc(p.weeks)}</span></h3>${rows}</div>`;
  }).join('');
  return `
  <header class="hero">
    <div class="eyebrow"><span class="label">1 to 2 hours a day</span><span class="label">24 weeks</span></div>
    <h1>Weekly study plan</h1>
    <p class="lead">One focus and one deliverable per week. Tick a week when its deliverable is finished and saved in your repository.</p>
    <div id="wprog" style="display:flex;flex-direction:column;gap:8px">${weekProgress()}</div>
  </header>
  <section class="section">${groups}</section>`;
}

function buildLog() {
  const o = overall();
  let m = '## QA automation learning log\n\n';
  m += 'Path: manual testing to Playwright with TypeScript. Progress: ' + o.pct + '% (' + weeksDone() + ' of 24 weeks).\n\n';
  const earned = PHASES.filter(isEarned);
  if (earned.length) {
    m += earned.map(p => '![Phase ' + p.id + ': ' + p.badge.name + '](https://img.shields.io/badge/Phase_' + p.id + '-' + p.badge.name.replace(/ /g, '_') + '-0B6B5F)').join(' ') + '\n\n';
  }
  m += PHASES.map(p => {
    const l = (S.links[p.id] || '').trim();
    return '- Phase ' + p.id + ', ' + p.title + ': ' + (isEarned(p) ? 'badge "' + p.badge.name + '" earned ' + S.earned[p.id] : 'in progress') + (l ? ' ([work](' + l + '))' : '');
  }).join('\n') + '\n';
  return m;
}
function viewBadges() {
  const cards = PHASES.map(p => {
    const e = isEarned(p);
    return `<div class="bcard${e ? '' : ' locked'}"><div class="head">${badgeSvg(p.id, e)}<div><span class="label">Phase ${p.id}${e ? ' &middot; earned ' + S.earned[p.id] : ' &middot; locked'}</span><h3>${esc(p.badge.name)}</h3><p class="why">${esc(p.badge.desc)}</p></div></div>${reqs(p)}<div class="field"><label class="label" for="link-${p.id}">Link to your work</label><input id="link-${p.id}" type="url" data-link="${p.id}" placeholder="https://github.com/you/repository" value="${esc(S.links[p.id] || '')}"></div></div>`;
  }).join('');
  return `
  <header class="hero">
    <div class="eyebrow"><span class="label">Achievements</span><span class="label">${earnedCount()} of 6 earned</span></div>
    <h1>Badges and learning log</h1>
    <p class="lead">A badge unlocks when you finish every topic and exercise in a phase and pass its quiz. Add a link to the repository that proves it, then copy the log into the README of your learning project or into a LinkedIn post.</p>
  </header>
  <section class="section"><div class="bgrid">${cards}</div></section>
  <section class="section"><header><h2>Learning log</h2><p class="why">Markdown for your GitHub README. It updates as you progress. The badge images load from shields.io once the README is on GitHub.</p></header>
    <div class="code logbox"><div class="bar-top"><span class="lang">markdown</span><button class="copy" type="button" data-copylog="1">Copy</button></div><pre><code id="logpre">${esc(buildLog())}</code></pre></div></section>
  <section class="section"><header><h2>Start over</h2><p class="why">Clears topics, exercises, weeks, quiz results, badges and links from this browser.</p></header>
    <div><button class="btn ghost" type="button" data-act="reset" id="resetbtn">Reset all progress</button></div></section>`;
}

/* ---------- routing ---------- */
function route() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'plan' || h === 'badges' || /^phase-[1-6]$/.test(h)) return h;
  return 'overview';
}
function render() {
  const r = route(), v = $('#view');
  renderChrome(r);
  if (r === 'overview') v.innerHTML = viewOverview();
  else if (r === 'plan') v.innerHTML = viewPlan();
  else if (r === 'badges') v.innerHTML = viewBadges();
  else v.innerHTML = viewPhase(PHASES[+r.split('-')[1] - 1]);
}
function refreshLive() {
  syncEarned(); save();
  const r = route(); renderChrome(r);
  const m = /^phase-(\d)$/.exec(r);
  if (m) { const p = PHASES[+m[1] - 1]; $('#pprog').innerHTML = progressBlock(p); $('#pbadge').innerHTML = badgeBlock(p); }
  const w = $('#wprog'); if (w) w.innerHTML = weekProgress();
}

/* ---------- events ---------- */
async function copyText(text, btn, src) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch (err) {
    try { const rg = document.createRange(); rg.selectNodeContents(src); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); btn.textContent = 'Press Ctrl+C'; }
    catch (e2) { btn.textContent = 'Select and copy'; }
  }
  setTimeout(() => { btn.textContent = old; }, 1800);
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[data-kind]')) {
    const kind = t.dataset.kind;
    if (kind === 'topic') setFlag(S.topics, key(t.dataset.p, t.dataset.i), t.checked);
    else if (kind === 'ex') setFlag(S.ex, key(t.dataset.p, t.dataset.i), t.checked);
    else if (kind === 'week') setFlag(S.weeks, t.dataset.i, t.checked);
    const lab = t.closest('label'); if (lab) lab.classList.toggle('done', t.checked);
    refreshLive();
  } else if (t.matches('input[data-quiz]')) {
    const pid = +t.dataset.quiz, p = PHASES[pid - 1];
    const st = S.quiz[pid] || (S.quiz[pid] = {sel: [], done: false, score: 0});
    if (st.done) return;
    st.sel[+t.dataset.q] = +t.dataset.o;
    save();
    $('#qfoot').innerHTML = quizFoot(p);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[data-link]')) {
    S.links[t.dataset.link] = t.value; save();
    const lp = $('#logpre'); if (lp) lp.textContent = buildLog();
  }
});
let resetArmed = false;
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) { copyText(codeOf(b.dataset.copy), b, b.closest('.code').querySelector('code')); return; }
  if (b.dataset.copylog) { copyText(buildLog(), b, $('#logpre')); return; }
  const act = b.dataset.act; if (!act) return;
  if (act === 'grade') {
    const pid = +b.dataset.p, p = PHASES[pid - 1], st = S.quiz[pid];
    if (!st) return;
    st.score = p.quiz.filter((q, i) => st.sel[i] === q.a).length;
    st.done = true;
    $('#quiz').innerHTML = quizBlock(p);
    refreshLive();
  } else if (act === 'retake') {
    const pid = +b.dataset.p, p = PHASES[pid - 1];
    S.quiz[pid] = {sel: [], done: false, score: 0};
    save();
    $('#quiz').innerHTML = quizBlock(p);
    refreshLive();
  } else if (act === 'reset') {
    if (!resetArmed) {
      resetArmed = true; b.textContent = 'Click again to confirm';
      setTimeout(() => { resetArmed = false; if (b.isConnected) b.textContent = 'Reset all progress'; }, 4000);
    } else {
      resetArmed = false;
      S = {topics:{}, ex:{}, weeks:{}, quiz:{}, links:{}, earned:{}};
      save(); render();
    }
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

syncEarned();
render();
</script>

</body>
</html>
